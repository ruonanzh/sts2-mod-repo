# Pre-commit for this game repository. It runs only checks that do not touch the game.
# It needs lefthook on the machine (brew install lefthook, then lefthook install).
# You can also run each check by hand, for example: node scripts/check-doc-refs.mjs
pre-commit:
  parallel: true
  commands:
    doc-refs:
      # Every link and every backticked repository path must exist. This caught wrong relative
      # paths in a SKILL, and file names that belong to another repository.
      run: node scripts/check-doc-refs.mjs
    prompt-standard-en:
      # The machine part of the English writing rules: semicolons, symbols, open lists, marketing
      # words, the word folder, and sentences longer than 25 words. Rules: scripts/prompt-standard.md.
      run: node scripts/check-prompt-standard-en.mjs
    mod-page:
      # Keep page feedback path-specific, preserve inline art, and reject non-English editor text.
      run: node scripts/test-mod-page.mjs
    mod-install-deps:
      # The rule behind install_mod: fill an empty gap, never overwrite. If it ever starts
      # overwriting, this machine looks fine and the player silently keeps an old dependency.
      run: node scripts/test-mod-install-deps.mjs
    pck-pack:
      # The R0 lightweight packer must preserve PCK offsets and hashes, emit imported PNG pairs,
      # stay deterministic, and reject bad source images without leaving a partial pack.
      run: node scripts/test-pck-pack.mjs
    mod-install-ritsulib:
      # RitsuLib uses mod_manifest.json and nested shared/compat runtime directories.
      run: node scripts/test-mod-install-ritsulib.mjs
    ritsulib-contract:
      # Compile package, runtime version, vendor manifest, and dump sources must agree.
      run: node scripts/test-ritsulib-contract.mjs
    mod-lint-ritsulib:
      # Cover PCK modes, missing assets, stale artifacts, and framework dependency rules.
      run: node scripts/test-mod-lint-ritsulib.mjs
    inspect-code-incomplete:
      # A partial configured dump must not be reported as a successful complete dump.
      run: node scripts/test-inspect-code-incomplete.mjs
    example-card:
      # The reference card must keep its RitsuLib package, assets, and full build contract.
      run: node scripts/test-example-card.mjs
    pi-lib:
      # Package version selection, multi-assembly resolution, and dump readers share this suite.
      run: cd .pi/lib && bun test
    # If this game needs another check, for example probe options that must match the tool surface,
    # add a command here and put the script in scripts/. Do not reserve a hook for one game in a
    # skeleton repository.
